name: Build Windows Executable (.exe)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file windowed executable (.exe)
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name "YouTube-Downloader" --add-data "static;static" --collect-all static_ffmpeg --collect-all yt_dlp_ejs --collect-all webview --collect-all pythonnet --collect-all clr_loader app.py

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-Windows-EXE
          path: dist/YouTube-Downloader.exe
